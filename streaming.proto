syntax = "proto3";

package streaming;

import "common/empty.proto";
import "common/error.proto";
import "common/ping.proto";
import "battle.proto";

message BattleRequest {
  oneof input {
    BattleCreate     create = 1;
    BattleStart      start = 2;
    BattleMove       move = 3;
    common.ping.Ping ping = 4;
    BattleLeave      leave = 5;
    BattleJoinBot    connect_bot = 6;
  }
}

message BattleResponse {
  oneof output {
    battle.BattleObject      battle = 1;
    common.empty.Empty       ping = 2;
    common.error.ErrorObject error = 3;
  }
}

message BattleStart {
  string battle_id = 1;
}

message BattleCreate {
  string battle_id = 1;
}

message BattleLeave {
  string battle_id = 1;
}

message BattleJoinBot {
  string battle_id = 1;
}

message BattleMove {
  string battle_id = 1;
  int32  cell_idx = 2;
}
