syntax = "proto3";

package common.error;

message ErrorObject {
  ErrorCode code = 1;
  string    details = 2;
}

enum ErrorCode {
  UNKNOWN = 0;

  INVALID_SESSION = 1;
  ACCESS_DENIED = 2;
  NOT_FOUND = 3;
  VALIDATION_FAILED = 4;
  SERVICE_UNAVAILABLE = 5;
  INVALID_RESPONSE = 6;
  INVALID_AUTHORIZATION = 7;
  TOKEN_EXPIRED = 401;
}


