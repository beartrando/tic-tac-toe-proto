syntax = "proto3";

package battle;

import "google/protobuf/timestamp.proto";
import "profile.proto";
import "common/error.proto";

service Battle {
  rpc Get (BattleIdRequest) returns (BattlesResponse);
  rpc GetUnfinishedByProfile (profile.ProfileIdRequest) returns (BattlesResponse);
  rpc Create (BattleCreateRequest) returns (BattleResponse);
  rpc Leave (BattleLeaveRequest) returns (BattleResponse);
}

message BattleIdRequest {
  string battle_id = 1;
}

message BattleCreateRequest {
  string battle_id = 1;
  string profile_id = 2;
}

message BattleLeaveRequest {
  string battle_id = 1;
  string profile_id = 2;
}

enum BattleCellValue {
  CELL_EMPTY = 0;
  CELL_X = 1;
  CELL_O = 2;
}

enum BattleStatus {
  UNKNOWN = 0;
  CREATED = 1;
  READY = 2;
  STARTED = 3;
  FINISHED = 4;
  CANCELLED = 5;
}

message BattleObject {
  string                    id = 1;
  repeated BattleCellValue  board = 2;
  repeated string           player_ids = 3;
  BattleStatus              status = 4;
  string                    winner_id = 5;
  google.protobuf.Timestamp last_move_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message BattleResponse {
  oneof output {
    BattleObject             battle = 1;
    common.error.ErrorObject error = 2;
  }
}

message BattleList {
  repeated BattleObject items = 1;
}

message BattlesResponse {
  oneof output {
    BattleList               battles = 1;
    common.error.ErrorObject error = 2;
  }
}


